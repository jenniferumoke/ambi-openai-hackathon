<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Ambi: context becomes an offer, your choice becomes an action</title>
<desc id="desc">Local MediaPipe camera cues and enabled screen context feed observation freshness checks and offer selection. Normal mode uses Decisions; Ellis uses a catalog. Quiet, focus and cooldown gates lead to a suggestion. Acceptance or a direct user request reaches Realtime tools and the desktop worker. Local SQLite memory supplies context and stores notes and reports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#4e7969" stroke-width="1.7"/></marker></defs>
