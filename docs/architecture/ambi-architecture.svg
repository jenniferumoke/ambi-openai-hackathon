<text x="64" y="66" font-size="18" letter-spacing="3">AMBI / HOW IT WORKS</text>
<text x="64" y="122" font-size="40" font-weight="700">Context becomes an offer.</text>
<text x="64" y="172" font-size="40" font-weight="700">Your choice becomes an action.</text>
<text x="64" y="225" font-size="20" fill="#5c7469">Local awareness, a voice conversation, and a separate computer worker.</text>
