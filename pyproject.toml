[project]
name = "voice-computer-agent"
version = "0.1.0"
description = "A minimal local Realtime voice agent with an Agents SDK computer worker."
requires-python = ">=3.11"
dependencies = [
    "openai-agents[realtime]==0.24.0",
    "openai==3.41.0",
    "pillow==13.0.0",
    "pyautogui==0.9.54",
    "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
    "pyperclip==1.11.0",
    "python-dotenv==1.2.4",
    "sounddevice==0.5.6",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
